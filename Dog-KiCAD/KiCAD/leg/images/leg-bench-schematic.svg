<svg width="1240" height="920" class="sch" viewBox="0 0 1240 920" role="img" aria-labelledby="sch-title sch-desc" xmlns="http://www.w3.org/2000/svg">
<title id="sch-title">Leg bench wiring schematic</title>
<desc id="sch-desc">Teensy 4.1 pins 4, 5 and 6 drive the tilt, hip and knee servo signals. Pins 18 (SDA) and 19 (SCL) run to three Adafruit INA228 boards powered from the Teensy 3.3 V pin, at addresses 0x40, 0x41 and 0x44. Each board sits high side in one servo's power lead: the servo supply + goes to VIN+, through the board's 15 milliohm shunt to VIN-, and VIN- goes to the servo's V+. Arrows show the servo current. Each board's VBUS jumper ties VBUS to VIN+.</desc><style>svg{font-family:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}.sheet{fill:#FFFFFF}.griddot{fill:#C9D3D9}.part{fill:#F8FAFB;stroke:#18222A;stroke-width:1.6}.board{fill:#EEF4F1}.tblock{fill:#FFFFFF;stroke:#18222A;stroke-width:1.2}.tbrule{stroke:#18222A;stroke-width:1;fill:none}.body{fill:#FFFFFF;stroke:#18222A;stroke-width:1.6}.ibody{stroke-width:1.2}.sj{fill:#BF1F2B}.w{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.int{stroke-width:1.2}.bar{stroke-width:2.6}.arrow{stroke:none}.c-i2c{stroke:#1D62C2}.c-p3{stroke:#B85200}.c-srv{stroke:#BF1F2B}.c-pwm{stroke:#7339CC}.c-gnd{stroke:#18222A}.c-nc{stroke:#5A6974}.f-i2c{fill:#1D62C2}.f-p3{fill:#B85200}.f-srv{fill:#BF1F2B}.f-pwm{fill:#7339CC}.f-gnd{fill:#18222A}text{fill:#18222A}.tm{fill:#5A6974}.tp3{fill:#B85200}.ti2c{fill:#1D62C2}.tsrv{fill:#BF1F2B}.tpwm{fill:#7339CC}</style>
