<text class="t" x="80" y="84" font-size="12" text-anchor="middle" font-weight="600">SERVO SUPPLY</text>
<text class="tsrv" x="128" y="105" font-size="14" text-anchor="end" font-weight="600">+</text>
<text class="t" x="128" y="165" font-size="14" text-anchor="end" font-weight="600">−</text>
<text class="tm" x="70" y="126" font-size="11" text-anchor="middle">bench PSU</text>
<text class="tm" x="70" y="141" font-size="11" text-anchor="middle">or battery</text>
<text class="t" x="330" y="72" font-size="12" text-anchor="middle" font-weight="600">ADAFRUIT INA228</text>
<text class="t" x="240" y="66" font-size="11" text-anchor="middle">VIN</text>
<text class="t" x="228" y="94" font-size="11" text-anchor="start">VIN+</text>
<text class="t" x="432" y="94" font-size="11" text-anchor="end">VIN−</text>
<text class="tm" x="330" y="122" font-size="11" text-anchor="middle">15 mΩ shunt</text>
<text class="tp3" x="258" y="34" font-size="11" text-anchor="start" font-weight="600">VIN: 3.3 V from the Teensy, for the chip only</text>
<text class="t" x="595" y="82" font-size="12" text-anchor="middle" font-weight="600">SERVO</text>
<text class="t" x="538" y="105" font-size="11" text-anchor="start">V+ (red)</text>
<text class="t" x="538" y="165" font-size="11" text-anchor="start">GND (brown)</text>
<text class="t" x="400" y="214" font-size="11" text-anchor="middle" font-weight="600">TEENSY GND</text>
<text class="tm" x="458" y="214" font-size="11" text-anchor="start">board GNDs join here too</text>
<text class="tsrv" x="180" y="122" font-size="11" text-anchor="middle" font-weight="600">V_SERVO</text>
<text class="tsrv" x="485" y="122" font-size="11" text-anchor="middle" font-weight="600">servo V+</text>
<text class="t" x="250" y="180" font-size="11" text-anchor="middle">ground return</text>
