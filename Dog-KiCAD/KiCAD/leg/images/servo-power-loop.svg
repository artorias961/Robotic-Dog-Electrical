<svg width="680" height="240" class="sch loop" viewBox="0 0 680 240" role="img" aria-labelledby="loop-title loop-desc" xmlns="http://www.w3.org/2000/svg">
<title id="loop-title">One servo's power loop</title>
<desc id="loop-desc">Servo supply + goes to the board's VIN+ terminal, through the 15 milliohm shunt to VIN-, then to the servo's red V+ wire. The servo's ground wire returns to supply -, which also joins the Teensy GND and the boards' GND. The board's VIN pad takes 3.3 V from the Teensy and carries no servo current.</desc><style>svg{font-family:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}.sheet{fill:#FFFFFF}.griddot{fill:#C9D3D9}.part{fill:#F8FAFB;stroke:#18222A;stroke-width:1.6}.board{fill:#EEF4F1}.tblock{fill:#FFFFFF;stroke:#18222A;stroke-width:1.2}.tbrule{stroke:#18222A;stroke-width:1;fill:none}.body{fill:#FFFFFF;stroke:#18222A;stroke-width:1.6}.ibody{stroke-width:1.2}.sj{fill:#BF1F2B}.w{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.int{stroke-width:1.2}.bar{stroke-width:2.6}.arrow{stroke:none}.c-i2c{stroke:#1D62C2}.c-p3{stroke:#B85200}.c-srv{stroke:#BF1F2B}.c-pwm{stroke:#7339CC}.c-gnd{stroke:#18222A}.c-nc{stroke:#5A6974}.f-i2c{fill:#1D62C2}.f-p3{fill:#B85200}.f-srv{fill:#BF1F2B}.f-pwm{fill:#7339CC}.f-gnd{fill:#18222A}text{fill:#18222A}.tm{fill:#5A6974}.tp3{fill:#B85200}.ti2c{fill:#1D62C2}.tsrv{fill:#BF1F2B}.tpwm{fill:#7339CC}</style><rect class="sheet" x="0" y="0" width="680" height="240"/>
